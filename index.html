<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little message for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night-top: #1b1a4a;
    --night-bottom: #3a2f78;
    --paper: #fbf6ee;
    --ink: #4a3a44;
    --rose: #e8506a;
    --cat: #f0a860;
    --cat-dark: #d98a3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Lora', Georgia, serif;
    color: #fff;
    background: linear-gradient(180deg, var(--night-top), var(--night-bottom));
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* stars + city */
  .stars, .city { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; opacity: .7; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 50% { opacity: .15; } }
  .moon { position: fixed; top: 9%; left: 50%; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; background: #f6e7a8; box-shadow: 0 0 40px 12px rgba(246,231,168,.35); }
  .city svg { position: absolute; bottom: 0; width: 100%; height: 22vh; }

  .stage { position: relative; z-index: 2; width: min(92vw, 420px); text-align: center; }
  .from { font-weight: 700; font-size: 1.25rem; margin-bottom: 8px; min-height: 1.6em; }
  .prompt { margin-top: 18px; font-weight: 700; font-size: 1.1rem; }

  /* cat */
  .cat { width: 130px; display: block; margin: 0 auto -34px; position: relative; z-index: 3; transition: transform .6s; }
  .cat .tail { transform-origin: 150px 150px; animation: wag 2s infinite ease-in-out; }
  @keyframes wag { 50% { transform: rotate(14deg); } }

  /* envelope */
  .envelope {
    position: relative; width: 260px; height: 170px; margin: 0 auto;
    background: var(--paper); border-radius: 8px; cursor: pointer;
    border: 5px solid transparent;
    background-image: linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(135deg, var(--rose) 0 14px, #fff 14px 28px, #4a6fd6 28px 42px, #fff 42px 56px);
    background-origin: border-box; background-clip: padding-box, border-box;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
    transition: transform .5s, opacity .5s;
    animation: float 3s infinite ease-in-out;
  }
  .envelope:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .envelope::before { /* flap lines */
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to bottom right, transparent 49.5%, #d9cdbb 50%, transparent 50.6%) top left / 50% 62% no-repeat,
      linear-gradient(to bottom left, transparent 49.5%, #d9cdbb 50%, transparent 50.6%) top right / 50% 62% no-repeat;
  }
  .seal {
    position: absolute; left: 50%; top: 42%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: var(--rose); display: grid; place-items: center;
    font-size: 1.3rem; box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .open-btn {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 18px;
    font-size: .85rem; font-weight: 500; white-space: nowrap;
  }
  .env-wrap { max-height: 280px; transition: max-height .9s ease, opacity .5s; }
  body.opened .env-wrap { max-height: 0; opacity: 0; overflow: hidden; pointer-events: none; }
  body.opened .envelope { animation: none; }

  /* cat rises and hops as the letter opens */
  body.opened .cat { animation: hop .9s ease; }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-34px); } 100% { transform: translateY(0); } }

  /* letter: grows in under the cat, pushing the cat upward */
  .letter {
    position: relative; width: 100%;
    max-height: 0; opacity: 0; overflow: hidden; pointer-events: none;
    transform: translateY(24px) scale(.95);
    background: var(--paper); color: var(--ink); border-radius: 14px;
    padding: 0 24px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    transition: max-height .9s ease, padding .9s ease, opacity .6s .25s, transform .8s .25s cubic-bezier(.2,.9,.3,1.2);
  }
  body.opened .letter {
    max-height: calc(100vh - 240px); padding: 40px 24px 22px; overflow-y: auto;
    opacity: 1; transform: none; pointer-events: auto;
  }
  .letter .tag { font-size: .7rem; letter-spacing: .25em; color: #a89aa0; margin-bottom: 8px; }
  .letter .badge {
    display: inline-block; font-size: .8rem; font-weight: 700; padding: 3px 12px; margin: 10px 0 14px;
    border: 1px solid #e6d9cb; border-radius: 8px; background: #fff;
  }
  .letter p { font-family: 'Caveat', cursive; font-size: 1.45rem; line-height: 1.35; white-space: pre-wrap; text-align: left; min-height: 6em; }
  .letter .sign { font-family: 'Caveat', cursive; font-size: 1.5rem; margin-top: 12px; text-align: right; color: var(--rose); }
  .letter .foot { font-size: .65rem; color: #b9aab0; margin-top: 14px; }
  .replay { margin-top: 12px; background: none; border: 1px solid #e6d9cb; color: var(--ink); border-radius: 999px; padding: 5px 14px; font: inherit; font-size: .8rem; cursor: pointer; }

  /* hearts */
  .heart { position: fixed; z-index: 5; pointer-events: none; font-size: 18px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(var(--r)); opacity: .9; } }

  @media (prefers-reduced-motion: reduce) {
    .star, .envelope, .cat .tail { animation: none; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="city">
  <svg viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#241f5c">
      <rect x="10" y="40" width="40" height="60"/><rect x="60" y="20" width="30" height="80"/>
      <rect x="100" y="55" width="45" height="45"/><rect x="250" y="35" width="35" height="65"/>
      <rect x="295" y="55" width="40" height="45"/><rect x="345" y="25" width="45" height="75"/>
    </g>
    <g fill="#f3c969">
      <rect x="20" y="52" width="8" height="8"/><rect x="70" y="35" width="8" height="8"/>
      <rect x="260" y="48" width="8" height="8"/><rect x="355" y="40" width="8" height="8"/>
    </g>
  </svg>
</div>

<main class="stage">
  <div class="from" id="fromLine"></div>

  <svg class="cat" viewBox="0 0 200 190" aria-hidden="true">
    <path class="tail" d="M150 150 C190 150 195 110 175 100" stroke="#d98a3d" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="150" rx="48" ry="34" fill="#f0a860"/>
    <polygon points="48,70 52,22 88,48" fill="#f0a860"/><polygon points="152,70 148,22 112,48" fill="#f0a860"/>
    <polygon points="56,58 58,34 76,48" fill="#f7c4c4"/><polygon points="144,58 142,34 124,48" fill="#f7c4c4"/>
    <ellipse cx="100" cy="82" rx="56" ry="48" fill="#f0a860"/>
    <path d="M90 40 v14 M100 36 v16 M110 40 v14" stroke="#d98a3d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="78" cy="82" r="10" fill="#3b2a2a"/><circle cx="122" cy="82" r="10" fill="#3b2a2a"/>
    <circle cx="81" cy="78" r="3.5" fill="#fff"/><circle cx="125" cy="78" r="3.5" fill="#fff"/>
    <ellipse cx="100" cy="98" rx="5" ry="3.5" fill="#e8506a"/>
    <path d="M100 101 q-8 10 -16 4 M100 101 q8 10 16 4" stroke="#3b2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="64" cy="100" r="8" fill="#f28b8b" opacity=".45"/><circle cx="136" cy="100" r="8" fill="#f28b8b" opacity=".45"/>
    <path d="M88 128 l12 10 l12 -10 l-6 -6 h-12z" fill="#e8506a"/>
  </svg>

  <div class="env-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your message">
      <div class="seal">❤</div>
      <div class="open-btn">Tap to open</div>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>

  <section class="letter" id="letter" aria-live="polite">
    <div class="tag">JUST BECAUSE</div>
    <div class="badge" id="dear"></div>
    <p id="body"></p>
    <div class="sign" id="sign"></div>
    <button class="replay" id="replay" type="button">Read again</button>
    <div class="foot">a little message from Rhodji</div>
  </section>
</main>

<script>
/* ========== EDIT THESE ========== */
const CONFIG = {
  from:  "Rhodji",          // your name
  to:    "My Love",          // who it's for
  message:
`To my hardworking girl,
I see every effort you make even
when you think no one notices.
I'm proud of the strength you
carry and the passion you put
Into everything you do.

You inspire me every single day.
Keep going love, I'll always be
right here cheering for you.`,
  typingSpeed: 38            // ms per character
};
/* ================================ */

const $ = id => document.getElementById(id);
$('fromLine').textContent = `From ${CONFIG.from}, with love`;
$('prompt').textContent   = 'Kitty got a new message for you';
$('dear').textContent     = `Dear ${CONFIG.to}`;
$('sign').textContent     = `with love, ${CONFIG.from} ❤`;

// stars
const starBox = $('stars');
for (let i = 0; i < 70; i++) {
  const s = document.createElement('span');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 70 + '%';
  s.style.animationDelay = Math.random() * 3 + 's';
  starBox.appendChild(s);
}

// hearts
function hearts(n = 40) {
  const set = ['❤', '💖', '💗', '🌸'];
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = set[Math.floor(Math.random() * set.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.top = '-30px';
    h.style.fontSize = 14 + Math.random() * 18 + 'px';
    h.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
    h.style.animationDuration = 3 + Math.random() * 3 + 's';
    h.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

// typewriter
let timer;
function type() {
  clearInterval(timer);
  const el = $('body'); el.textContent = '';
  let i = 0;
  timer = setInterval(() => {
    el.textContent += CONFIG.message[i++];
    if (i >= CONFIG.message.length) clearInterval(timer);
  }, CONFIG.typingSpeed);
}

function openLetter() {
  if (document.body.classList.contains('opened')) return;
  document.body.classList.add('opened');
  hearts(45);
  setTimeout(type, 500);
}

$('envelope').addEventListener('click', openLetter);
$('envelope').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); }
});
$('replay').addEventListener('click', () => { hearts(25); type(); });
</script>
</body>
</html>
