<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little message for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf5ee;
    --ink: #5a3d48;
    --rose: #e0336e;
    --gold: #f2b441;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Lora', Georgia, serif;
    color: #fff;
    background: radial-gradient(circle at 50% 36%, #a3154f 0%, #6e0a3a 48%, #2f0419 100%);
    overflow-x: hidden; overflow-y: auto;
    display: flex;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ambient background: bokeh + petals */
  .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bokeh { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,120,160,.55), rgba(255,120,160,0) 70%); filter: blur(6px); animation: pulse 6s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(1.15); } }
  .petal { position: absolute; top: -6vh; border-radius: 60% 0 60% 60%; animation: drift linear infinite; opacity: .85; }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0); }
    50%  { transform: translate(var(--sway), 55vh) rotate(180deg); }
    100% { transform: translate(0, 112vh) rotate(360deg); }
  }

  .stage { position: relative; z-index: 2; width: min(92vw, 420px); text-align: center; margin: auto; padding: 24px 0; }
  .from { font-weight: 700; font-size: 1.3rem; margin-bottom: 6px; min-height: 1.6em; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .prompt { margin-top: 36px; font-weight: 700; font-size: 1.15rem; text-shadow: 0 2px 10px rgba(0,0,0,.35); }

  /* cat */
  .cat { width: 130px; display: block; margin: 0 auto -30px; position: relative; z-index: 3; }
  .tail { transform-origin: 150px 150px; animation: wag 2s infinite ease-in-out; }
  @keyframes wag { 50% { transform: rotate(14deg); } }
  body.opened .cat { animation: hop .9s ease; }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-34px); } 100% { transform: translateY(0); } }

  /* envelope */
  .env-wrap { max-height: 300px; transition: max-height .9s ease, opacity .5s; }
  body.opened .env-wrap { max-height: 0; opacity: 0; overflow: hidden; pointer-events: none; }
  .envelope {
    position: relative; width: 270px; height: 176px; margin: 0 auto; cursor: pointer;
    filter: drop-shadow(0 16px 26px rgba(0,0,0,.4));
    animation: float 3s infinite ease-in-out;
  }
  body.opened .envelope { animation: none; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .envelope:focus-visible { outline: 3px solid #fff; outline-offset: 8px; border-radius: 10px; }
  .envelope svg { width: 100%; height: 100%; display: block; }
  .open-btn {
    position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%);
    background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 22px;
    font-size: .85rem; font-weight: 500; white-space: nowrap; box-shadow: 0 6px 14px rgba(0,0,0,.3);
  }

  /* letter card */
  .letter {
    position: relative; width: 100%;
    max-height: 0; min-height: 0; opacity: 0; overflow: hidden; pointer-events: none;
    transform: translateY(24px) scale(.95);
    background: var(--paper); color: var(--ink); border-radius: 18px;
    padding: 0 26px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    transition: max-height .9s ease, min-height .9s ease, padding .9s ease, opacity .6s .25s, transform .8s .25s cubic-bezier(.2,.9,.3,1.2);
  }
  body.opened .letter {
    max-height: 2400px; min-height: 0;
    padding: 38px 26px 24px; opacity: 1; transform: none; pointer-events: auto;
  }
  .letter::before { content: ""; position: absolute; inset: 9px; border: 1px solid #eadfd2; border-radius: 12px; pointer-events: none; }
  .tag { font-size: .68rem; letter-spacing: .3em; color: #a99aa0; }
  .mark { width: 84px; height: 84px; margin: 12px auto 0; border-radius: 50%; background: rgba(242,180,65,.16); display: grid; place-items: center; overflow: hidden; }
  .mark svg { width: 70px; opacity: .55; }
  .badge {
    display: inline-block; font-size: .8rem; font-weight: 700; padding: 3px 14px; margin: -12px 0 16px;
    border: 1px solid #e6d9cb; border-radius: 8px; background: #fff; position: relative;
  }
  .letter p { font-size: 1rem; font-weight: 500; line-height: 1.6; white-space: pre-wrap; }
  .sign { font-style: italic; font-size: .9rem; margin-top: 14px; color: var(--rose); }
  .foot { font-size: .62rem; color: #b9aab0; margin-top: 22px; }

  /* watch bar */
  .watch {
    display: flex; align-items: center; gap: 12px; text-align: left;
    margin-top: 0; max-height: 0; overflow: hidden; opacity: 0; padding: 0 14px;
    border: 2px solid transparent; border-radius: 16px; background: rgba(60,5,30,.55);
    transition: max-height .9s ease, margin .9s ease, padding .9s ease, opacity .6s .6s, border-color .6s .6s;
  }
  body.opened .watch { max-height: 80px; margin-top: 16px; padding: 10px 14px; opacity: 1; border-color: var(--gold); }
  .watch .ico { font-size: 1.6rem; }
  .watch .txt { flex: 1; line-height: 1.25; }
  .watch .txt b { display: block; font-size: .85rem; }
  .watch .txt span { font-size: .7rem; opacity: .8; }
  .watch button {
    background: var(--gold); color: #5a2a06; border: 0; border-radius: 999px; padding: 8px 16px;
    font: inherit; font-weight: 700; font-size: .8rem; cursor: pointer;
  }

  /* heart burst */
  .heart { position: fixed; z-index: 5; pointer-events: none; top: -30px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(108vh) rotate(var(--r)); opacity: .9; } }

  @media (prefers-reduced-motion: reduce) { .bokeh, .petal, .tail, .envelope { animation: none; } }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<main class="stage">
  <div class="from" id="fromLine"></div>

  <svg class="cat" id="cat" viewBox="0 0 200 190" aria-hidden="true">
    <path class="tail" d="M150 150 C190 150 195 110 175 100" stroke="#d98a3d" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="150" rx="48" ry="34" fill="#f0a860"/>
    <polygon points="48,70 52,22 88,48" fill="#f0a860"/><polygon points="152,70 148,22 112,48" fill="#f0a860"/>
    <polygon points="56,58 58,34 76,48" fill="#f7c4c4"/><polygon points="144,58 142,34 124,48" fill="#f7c4c4"/>
    <ellipse cx="100" cy="82" rx="56" ry="48" fill="#f0a860"/>
    <path d="M90 40 v14 M100 36 v16 M110 40 v14" stroke="#d98a3d" stroke-width="5" stroke-linecap="round"/>
    <circle class="socket" cx="78" cy="82" r="12" fill="#2a2c66"/>
    <g class="eye"><circle cx="78" cy="82" r="8.5" fill="#12133a"/><circle cx="82" cy="77" r="4.5" fill="#fff"/><circle cx="75" cy="88" r="2" fill="#8fa2ff"/></g>
    <circle class="socket" cx="122" cy="82" r="12" fill="#2a2c66"/>
    <g class="eye"><circle cx="122" cy="82" r="8.5" fill="#12133a"/><circle cx="126" cy="77" r="4.5" fill="#fff"/><circle cx="119" cy="88" r="2" fill="#8fa2ff"/></g>
    <ellipse cx="100" cy="98" rx="5" ry="3.5" fill="#e8506a"/>
    <path d="M100 101 q-8 10 -16 4 M100 101 q8 10 16 4" stroke="#3b2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M52 98 h-18 M52 104 l-16 6 M148 98 h18 M148 104 l16 6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    <circle cx="64" cy="102" r="8" fill="#f28b8b" opacity=".45"/><circle cx="136" cy="102" r="8" fill="#f28b8b" opacity=".45"/>
    <path d="M84 128 l16 9 l16 -9 l-4 12 l-12 -4 l-12 4z" fill="#f48fb1"/><circle cx="100" cy="134" r="5" fill="#e0336e"/>
  </svg>

  <div class="env-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your message">
      <svg viewBox="0 0 270 176" aria-hidden="true">
        <defs>
          <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8226c"/><stop offset="1" stop-color="#bd0f4e"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c65a"/><stop offset="1" stop-color="#c98a1f"/></linearGradient>
        </defs>
        <rect width="270" height="176" rx="12" fill="#fdf4f5"/>
        <polygon points="0,18 0,176 140,92" fill="#f8e6e9"/>
        <polygon points="270,18 270,176 130,92" fill="#f8e6e9"/>
        <path d="M0 176 L135 84 L270 176 Z" fill="#f2dde1"/>
        <path d="M0 14 Q0 0 14 0 H256 Q270 0 270 14 L135 112 Z" fill="url(#flap)"/>
        <circle cx="135" cy="108" r="22" fill="url(#gold)"/>
        <ellipse cx="135" cy="113" rx="8" ry="6.5" fill="#7a4a12"/>
        <circle cx="125" cy="103" r="3.2" fill="#7a4a12"/><circle cx="131" cy="98" r="3.2" fill="#7a4a12"/>
        <circle cx="139" cy="98" r="3.2" fill="#7a4a12"/><circle cx="145" cy="103" r="3.2" fill="#7a4a12"/>
      </svg>
      <div class="open-btn">Tap to open</div>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>

  <section class="letter" id="letter" aria-live="polite">
    <div class="mark" id="mark"></div>
    <div class="badge" id="dear"></div>
    <p id="body"></p>
    <div class="sign" id="sign"></div>
    <div class="foot" id="foot"></div>
  </section>

  <div class="watch" id="watchBar">
    <div class="ico">💌</div>
    <div class="txt"><b id="watchTitle"></b><span>Your card · 18 sec</span></div>
    <button id="replay" type="button">▶ Watch</button>
  </div>
</main>

<script>
/* ========== EDIT THESE ========== */
const CONFIG = {
  from:  "Rhodji",          // your name
  to:    "My Love",          // who it's for
  message:
`To my hardworking
girl, I love you, I am so
proud of you, I always
appreciate you, I will
always be here for you no
matter what, you are
amazing, hold that head
high, you've worked so
hard, you deserve all the
goods that's coming your
way!`,
  typingSpeed: 38            // ms per character
};
/* ================================ */

const $ = id => document.getElementById(id);
$('fromLine').textContent   = `From ${CONFIG.from}, with love`;
$('prompt').textContent     = 'Kitty got a new message for you';
$('dear').textContent       = `Dear ${CONFIG.to}`;
$('sign').textContent       = `with love, ${CONFIG.from} ♥`;
$('foot').textContent       = `a little message from ${CONFIG.from}`;
$('watchTitle').textContent = `Watch ${CONFIG.from}'s card as a little movie`;
$('mark').appendChild($('cat').cloneNode(true));

// ambient bokeh + petals
const amb = $('ambient');
const rnd = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < 9; i++) {
  const b = document.createElement('div'); b.className = 'bokeh';
  const s = rnd(60, 150);
  Object.assign(b.style, { width: s + 'px', height: s + 'px', left: rnd(-5, 95) + '%', top: rnd(5, 95) + '%', animationDelay: rnd(0, 6) + 's' });
  amb.appendChild(b);
}
const petalColors = ['#ff4f8b', '#e0336e', '#ff8fb3', '#c2185b', '#ffb3c9'];
for (let i = 0; i < 26; i++) {
  const p = document.createElement('span'); p.className = 'petal';
  const s = rnd(8, 16);
  Object.assign(p.style, {
    width: s + 'px', height: s * 1.2 + 'px', left: rnd(0, 100) + '%',
    background: petalColors[i % petalColors.length],
    animationDuration: rnd(9, 18) + 's', animationDelay: -rnd(0, 18) + 's'
  });
  p.style.setProperty('--sway', rnd(-60, 60) + 'px');
  amb.appendChild(p);
}

// heart burst
function hearts(n = 40) {
  const colors = ['#f2b441', '#ff5f95', '#ff8fb3', '#ffd37a', '#e0336e'];
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '♥';
    h.style.color = colors[Math.floor(Math.random() * colors.length)];
    h.style.left = rnd(0, 100) + 'vw';
    h.style.fontSize = rnd(14, 32) + 'px';
    h.style.setProperty('--r', rnd(-180, 180) + 'deg');
    h.style.animationDuration = rnd(3, 6) + 's';
    h.style.animationDelay = rnd(0, 1.2) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

// typewriter
let timer;
function type() {
  clearInterval(timer);
  const el = $('body'); el.textContent = '';
  let i = 0;
  timer = setInterval(() => {
    el.textContent += CONFIG.message[i++];
    if (i >= CONFIG.message.length) clearInterval(timer);
  }, CONFIG.typingSpeed);
}

function openLetter() {
  if (document.body.classList.contains('opened')) return;
  document.body.classList.add('opened');
  hearts(45);
  setTimeout(type, 500);
}

$('envelope').addEventListener('click', openLetter);
$('envelope').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); }
});
$('replay').addEventListener('click', () => { hearts(25); type(); });

// eyes follow the cursor / finger
const eyes = [...document.querySelectorAll('.eye')];
function look(x, y) {
  eyes.forEach(g => {
    const r = g.previousElementSibling.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, dist / 160) * 3.8;   // max pupil travel (SVG units)
    g.setAttribute('transform', `translate(${(dx / dist * k).toFixed(2)} ${(dy / dist * k).toFixed(2)})`);
  });
}
document.addEventListener('pointermove', e => look(e.clientX, e.clientY));
document.addEventListener('pointerdown', e => look(e.clientX, e.clientY));
document.addEventListener('pointerleave', () => look(innerWidth / 2, innerHeight / 2));
</script>
</body>
</html>
